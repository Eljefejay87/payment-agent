name: USAePay validation

on:
  push:
    branches:
      - codex/usaepay-payment-receipts
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab
      - name: Compile Python
        run: python -m compileall -q agents shared tests
      - name: Run full unit test suite
        run: python -m unittest discover -s tests -v
      - name: Build production runtime image
        run: docker build --target runtime -t ucm-payment-agent:usaepay .
      - name: Validate production image database initialization
        run: docker run --rm -e DATABASE_PATH=/tmp/payment-agent.sqlite3 ucm-payment-agent:usaepay python main.py init-db
      - name: Validate production image health command
        run: docker run --rm -e PAYMENT_AGENT_HEALTH_PATH=/tmp/payment-agent-health.json ucm-payment-agent:usaepay python main.py health
